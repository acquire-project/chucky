# This file identifies the different names that may be used for one machine.
#
# A sweep's name is the first part of its results file name. sweep.py takes it
# from --machine, or uses the hostname when you do not pass one. One name is not
# always one machine: a computer can boot two systems, and a cluster gives out a
# different node each time you ask for one.
#
# An entry matches a sweep by its name, or by the hostname stored in the file.
# Both accept wildcards and ignore case, and the first matching entry wins. A
# sweep that matches nothing keeps its own name, and the report marks it as not
# described here.
#
# Names and descriptions here are the presentation source of truth on every
# report page. Recorded hardware stays in the measurement provenance. The names
# list also accepts explicit archived run IDs whose host has been confirmed.

[[machine]]
name = "m4-pro"
description = "MacBook Pro"
names = ["m4-pro", "osx m4", "osx-m4", "laptop-s1qrti9n", "czimacos5155-m4-pro"]
hosts = ["LAPTOP-S1QRTI9N*", "CZIMACOS5155*"]
[machine.specs]
cpu = "Apple M4 Pro"
memory = "48 GB"
storage = "512 GB SSD"
os = "macOS (arm64)"

[[machine]]
name = "livescreen"
description = "Workstation with two operating systems installed"
names = ["LiveScreen-1", "livescreen-kubuntu"]
[machine.specs]
gpu = "NVIDIA RTX PRO 6000 Blackwell Workstation Edition"

[[machine]]
name = "reef-l40"
description = "One of the CoreWeave L40 nodes"
names = ["reef-l40"]
hosts = ["cw-us-e4a2-l40-*"]
[machine.specs]
gpu = "NVIDIA L40"
cpu = "Intel Xeon Platinum 8462Y+"
storage = "Local RAID1 (2 drives, XFS, ~2.6 GB/s) or shared NFS (~7-9 GB/s at QD32+); varies by run"

# The fast local storage on this cluster, and the only place a write-path
# sweep can push past a few GB/s. No GPU, so the sweep runs --backend cpu.
[[machine]]
name = "turin-raid10"
description = "A CoreWeave cpu-turin node with an unencrypted eight-drive array"
names = ["turin-raid10", "reef-turin"]
hosts = ["cpu-turin-gp-l-*"]
[machine.specs]
gpu = "None"
cpu = "AMD EPYC 9655P (96 cores)"
storage = "Local RAID10 (8 drives, XFS, ~16 GB/s)"

[[machine]]
name = "reef-h100"
description = "One of the CoreWeave H100 nodes"
names = ["reef-h100"]
hosts = ["cw-us-e4a1-h100-*"]
[machine.specs]
storage = "shared /mnt/main0"

[[machine]]
name = "reef-h200"
description = "One of the CoreWeave H200 nodes"
names = ["reef-h200"]
hosts = ["cw-us-e4a1-h200-*"]
[machine.specs]
storage = "shared /mnt/main0"

# A machine that always reports the same name needs only that name.
[[machine]]
name = "auk"
names = ["auk", "blosc-rtx5070-20260905"]
[machine.specs]
gpu = "RTX 5070 Laptop"
cpu = "AMD Ryzen AI 9 365 (10 cores / 20 threads)"
storage = "2 TB Lexar NM790 NVMe SSD; ~4.3 GB/s sequential direct write (64 GiB)"

[[machine]]
name = "oreb"
names = ["oreb", "rtx5080", "blosc-rtx5080-20260905", "blosc-rtx5080-20260916"]
hosts = ["oreb"]
[machine.specs]
gpu = "NVIDIA GeForce RTX 5080"
cpu = "AMD Ryzen 5 7600X (6 cores / 12 threads)"
