x-s3-tests: &s3-tests
  depends_on:
    s3mock:
      condition: service_healthy
  environment:
    AWS_ACCESS_KEY_ID: testing
    AWS_SECRET_ACCESS_KEY: testing
    AWS_ENDPOINT_URL: "http://s3mock:9090"
    AWS_DEFAULT_REGION: "us-east-1"
  init: true

services:
  s3-blackhole:
    profiles:
      - benchmark
    build:
      context: .
      dockerfile: Dockerfile.s3-blackhole
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 250ms
    init: true

  s3mock:
    image: adobe/s3mock:5.2.2@sha256:e7c36014dcf4c7f0f6bec9de888477d1d9b8f55eceb7d9c1186f70d7aadf81ca
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    tmpfs:
      - /s3mockroot:uid=1000,gid=1000
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/favicon.ico"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s

  test:
    <<: *s3-tests
    build:
      context: .
      args:
        # Defaults match the Dockerfile (CUDA 13.2). CI overrides via env vars
        # to exercise the CUDA 12 build path on the same self-hosted runner.
        CUDA_VERSION: ${CUDA_VERSION:-13.2.1}
        CUDA_MAJOR: ${CUDA_MAJOR:-13}
        NVCOMP_VERSION: ${NVCOMP_VERSION:-5.1.0.21}
    devices:
      - nvidia.com/gpu=all
    command: ctest --test-dir build --output-on-failure

  test-cpu:
    <<: *s3-tests
    profiles: [ci]
    image: chucky-cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    command: ctest --test-dir build --output-on-failure

  coverage:
    <<: *s3-tests
    profiles: [ci]
    image: chucky-coverage
    build:
      context: .
      dockerfile: Dockerfile.coverage
    command: cmake --build build --target coverage
