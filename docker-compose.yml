services:
  s3-blackhole:
    profiles:
      - benchmark
    build:
      context: .
      dockerfile: Dockerfile.s3-blackhole
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 250ms
    init: true

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      args:
        # Defaults match the Dockerfile (CUDA 13.2). CI overrides via env vars
        # to exercise the CUDA 12 build path on the same self-hosted runner.
        CUDA_VERSION: ${CUDA_VERSION:-13.2.1}
        CUDA_MAJOR: ${CUDA_MAJOR:-13}
        NVCOMP_VERSION: ${NVCOMP_VERSION:-5.1.0.21}
    devices:
      - nvidia.com/gpu=all
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_DEFAULT_REGION: "us-east-1"
    command: ctest --test-dir build --output-on-failure
    init: true
