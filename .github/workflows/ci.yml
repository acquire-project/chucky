name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          tags: chucky-cpu
          load: true
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Run CPU tests
        run: >
          docker run --rm
          -e AWS_ACCESS_KEY_ID=minioadmin
          -e AWS_SECRET_ACCESS_KEY=minioadmin
          -e AWS_ENDPOINT_URL=http://localhost:9000
          chucky-cpu
          sh -c "minio server /tmp/minio-data --quiet &
          sleep 1 &&
          ctest --test-dir build --output-on-failure"

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: 2.0.5-0
          environment-name: ci
          create-args: >-
            cmake ninja sccache uv
            aws-c-s3 blosc lz4-c zstd llvm-openmp snappy zlib
          init-shell: bash
          cache-environment: true

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Build
        shell: micromamba-shell {0}
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          cmake --preset cpu-only \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        shell: micromamba-shell {0}
        run: >
          ctest --test-dir build
          --output-on-failure
          -E "(s3)"

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: 2.0.5-0
          environment-name: ci
          create-args: >-
            cmake ninja sccache uv
            aws-c-s3 blosc lz4-c zstd snappy zlib
          init-shell: bash
          cache-environment: true

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Build
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate ci
          cmake --preset cpu-only \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build

      - name: Test
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate ci
          ctest --test-dir build --output-on-failure -E "(s3)"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build coverage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.coverage
          tags: chucky-coverage
          load: true
          cache-from: type=gha,scope=coverage
          cache-to: type=gha,mode=max,scope=coverage

      - name: Run tests and generate coverage
        run: |
          docker run --name coverage-run \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            -e AWS_ENDPOINT_URL=http://localhost:9000 \
            chucky-coverage \
            sh -c "minio server /tmp/minio-data --quiet & sleep 1 && cmake --build build --target coverage"

      - name: Extract coverage report
        if: always()
        run: |
          docker cp coverage-run:/src/build/coverage ./coverage-report
          docker rm coverage-run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-report/lcov.info
          fail_ci_if_error: false

  gpu-tests:
    runs-on: [self-hosted, Linux, gpu]
    strategy:
      fail-fast: false
      matrix:
        cuda:
          - { major: 13, version: 13.2.1 }
          - { major: 12, version: 12.8.1 }
    name: gpu-tests (cuda${{ matrix.cuda.major }})
    env:
      CUDA_VERSION: ${{ matrix.cuda.version }}
      CUDA_MAJOR: ${{ matrix.cuda.major }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (GPU, CUDA ${{ matrix.cuda.version }})
        run: docker compose run --rm test

      - name: Cleanup
        if: always()
        run: docker compose down
