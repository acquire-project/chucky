<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmarks over time</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="site.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
.lede { color: var(--text-secondary); font-size: 0.9em; margin: 0 0 var(--gap); }
h1 { font-size: 1.35em; margin: 0 0 4px; }
h2 { font-size: 1.02em; margin: 0; }
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--gap); margin-bottom: var(--gap);
}
.card-sub { color: var(--text-secondary); font-size: 0.82em; margin: 2px 0 12px; }
.note { color: var(--text-muted); font-size: 0.78em; margin: 8px 0 0; }
.empty { color: var(--text-secondary); font-size: 0.9em; padding: 24px 0; text-align: center; }
.link-button {
  font: inherit; font-size: inherit; padding: 2px 6px; cursor: pointer;
  color: var(--series-1); background: none; border: none; text-decoration: underline;
}

/* Filters — one row, above everything they scope */
.filters {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px var(--gap); margin-bottom: var(--gap);
}
.filters .match-count { margin-left: auto; font-size: 0.8em; color: var(--text-secondary); }
.check {
  display: flex; align-items: center; gap: 5px; cursor: pointer;
  font-size: 0.88em; font-weight: 400; text-transform: none; letter-spacing: 0;
  color: var(--text-primary); padding: 5px 8px;
  background: var(--plane); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.check[hidden] { display: none; }

/* Machine tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
}
.tile-head { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.92em; }
.tile-key { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.tile-sub { color: var(--text-secondary); font-size: 0.78em; margin-top: 3px; }
.tile-specs { color: var(--text-muted); font-size: 0.72em; margin-top: 2px; min-height: 2.1em; }
.tile-warn { color: var(--critical); font-size: 0.72em; margin-top: 3px; }
.tile-value { font-size: 1.9em; font-weight: 650; line-height: 1.1; margin-top: 8px; }
.tile-value .unit { font-size: 0.45em; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
.tile-blank { font-size: 0.85em; color: var(--text-muted); margin-top: 12px; }
.tile-delta { font-size: 0.78em; margin-top: 3px; color: var(--text-secondary); }
.tile-delta .up { color: var(--good-text); font-weight: 600; }
.tile-delta .down { color: var(--critical); font-weight: 600; }
.tile-foot { color: var(--text-muted); font-size: 0.72em; margin-top: 8px; }
.tile-foot .fails { color: var(--critical); }
.tile svg { display: block; margin-top: 10px; overflow: visible; }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 0.82em; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 600; font-size: 0.92em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--plane); }
.matrix tbody tr { cursor: pointer; }
.matrix tbody tr[aria-selected="true"] { background: var(--plane); }
.matrix .scenario-cell { font-weight: 600; padding-left: 10px; border-left: 3px solid transparent; }
.matrix tbody tr[aria-selected="true"] .scenario-cell { border-left-color: var(--series-1); }
.matrix tbody tr:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
.cell-delta { font-size: 0.85em; margin-left: 6px; }
.cell-delta.up { color: var(--good-text); }
.cell-delta.down { color: var(--critical); }
.cell-flat { color: var(--text-muted); }
.machine-th { white-space: nowrap; }
.machine-th .tile-key { display: inline-block; margin-right: 5px; vertical-align: baseline; }
details summary { cursor: pointer; font-weight: 600; font-size: 0.95em; }
details[open] summary { margin-bottom: 12px; }
code { font-size: 0.92em; color: var(--text-secondary); }

/* Charts */
.chart-wrap { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--text-secondary); }
.legend-key { width: 18px; height: 2px; border-radius: 1px; flex: none; }
.legend-item .legend-value { color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* Small multiples: one panel per input */
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: var(--gap); }
.panel {
  background: var(--plane); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px 12px;
}
.panel[aria-current="true"] { border-color: var(--series-1); }
.panel-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-title {
  font: inherit; font-weight: 650; padding: 0; cursor: pointer;
  color: var(--text-primary); background: none; border: none;
}
.panel-title:hover { text-decoration: underline; }
.panel-sub { color: var(--text-muted); font-size: 0.76em; }
.panel .legend { margin-top: 8px; gap: 4px 12px; }
.axis text { fill: var(--text-muted); font-size: 11px; }
.axis path { display: none; }
.axis line { stroke: var(--axis); }
.grid line { stroke: var(--grid); }
.tick-label { fill: var(--text-muted); font-size: 11px; }
.tooltip {
  position: fixed; pointer-events: none; z-index: 20; max-width: 300px;
  background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  padding: 8px 10px; font-size: 0.78em; line-height: 1.45;
}
.tooltip .tt-head { color: var(--text-secondary); margin-bottom: 5px; }
.tooltip .tt-row { display: flex; align-items: baseline; gap: 7px; }
.tooltip .tt-key { width: 14px; height: 2px; border-radius: 1px; flex: none; position: relative; top: -3px; }
.tooltip .tt-value { font-weight: 650; font-variant-numeric: tabular-nums; }
.tooltip .tt-name { color: var(--text-secondary); }

@media (max-width: 620px) {
  .filters { flex-direction: column; align-items: stretch; }
  .filters .match-count { margin-left: 0; }
}
</style>
</head>
<body>
<header class="site-head">
  <span class="brand">chucky benchmarks</span>
  <nav>
    <a href="index.html" aria-current="page">Over time</a>
    <a href="explore.html">Benchmark explorer</a>
  </nav>
  <a class="repo-link" href="https://github.com/acquire-project/chucky">Source</a>
  <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
</header>

<main>
  <h1>Performance over time</h1>
  <p class="lede" id="lede"></p>

  <section class="filters" aria-label="Filters">
    <div>
      <label for="metric-sel">Metric</label>
      <select id="metric-sel"></select>
    </div>
    <div>
      <label for="scenario-sel">Scenario</label>
      <select id="scenario-sel"></select>
    </div>
    <div>
      <label for="codec-sel">Codec</label>
      <select id="codec-sel"></select>
    </div>
    <div>
      <label for="fill-sel">Input</label>
      <select id="fill-sel"></select>
    </div>
    <div>
      <label for="backend-sel">Backend</label>
      <select id="backend-sel"></select>
    </div>
    <div>
      <label for="sink-sel">Sink</label>
      <select id="sink-sel"></select>
    </div>
    <div>
      <label for="group-toggle">Machines</label>
      <label class="check"><input type="checkbox" id="group-toggle" checked> Group</label>
    </div>
    <span class="match-count" id="match-count"></span>
  </section>

  <section class="tiles" id="tiles" aria-label="Machines"></section>

  <section class="card">
    <div class="card-head">
      <h2>Trend</h2>
      <label class="check" id="same-scale-check" hidden><input type="checkbox" id="same-scale" checked> Same scale</label>
    </div>
    <p class="card-sub" id="trend-sub"></p>
    <div class="panels" id="trend-panels"></div>
    <p class="note" id="trend-note"></p>
  </section>

  <section class="card">
    <h2>Latest sweep</h2>
    <p class="card-sub" id="matrix-sub"></p>
    <div id="matrix"></div>
  </section>

  <section class="card">
    <h2>Biggest changes</h2>
    <p class="card-sub" id="movers-sub"></p>
    <div id="movers"></div>
  </section>

  <details class="card" id="table-view">
    <summary>Trend table</summary>
    <div id="trend-table"></div>
  </details>

  <p class="note" id="footnotes"></p>
</main>

<script type="module">
import {decodeRuns, fetchJson} from "./decode.js";

const DATA = await fetchJson("data/overview.json");
DATA.sweeps.forEach(s => { s.runs = decodeRuns(s.runs, DATA.strings); });

const MAX_SERIES = 8;
const SERIES_VARS = Array.from({length: MAX_SERIES}, (_, i) => `var(--series-${i + 1})`);

const METRICS = [
  {key: "throughput_in_gibs", label: "Input throughput", unit: "GiB/s", better: "high"},
  {key: "throughput_out_gibs", label: "Output throughput", unit: "GiB/s", better: "high"},
  {key: "compression_fold", label: "Compression ratio", unit: "x", better: "high"},
  {key: "wall_s", label: "Wall-clock time", unit: "s", better: "low"},
  {key: "init_s", label: "Startup time", unit: "s", better: "low"},
  {key: "stalls.max_append_ms", label: "Slowest append block", unit: "ms", better: "low",
   note: "one append is a multi-frame block push, not a single frame"},
  {key: "stalls.peak_pending_mib", label: "Peak pending bytes", unit: "MiB", better: "low"},
  {key: "diagnostics.batch_drain.wall_pct", label: "Producer blocked in batch delivery", unit: "% wall", better: "low",
   note: "includes inline delivery work when no delivery worker is available"},
  {key: "diagnostics.d2h_dispatch.wall_pct", label: "D2H dispatch work", unit: "% wall", better: "low"},
  {key: "diagnostics.output_slot_io.wall_pct", label: "Wait for output-slot writes", unit: "% wall", better: "low"},
  {key: "diagnostics.footer_buffer_io.wall_pct", label: "Wait for footer-buffer write", unit: "% wall", better: "low"},
  {key: "diagnostics.append_extent_io.wall_pct", label: "Wait for closed-shard writes", unit: "% wall", better: "low"},
  {key: "diagnostics.final_io.wall_pct", label: "Wait for final queued writes", unit: "% wall", better: "low"},
  {key: "diagnostics.sink_backpressure.wall_pct", label: "Wait for sink queue below limit", unit: "% wall", better: "low",
   retired: "backpressure_ms"},
  {key: "diagnostics.prior_tail_state.wall_pct", label: "Compress-to-aggregate gap: prior tail", unit: "% wall", better: "low",
   retired: "tail_gate_ms"},
  {key: "diagnostics.staging_reuse.wall_pct", label: "Wait for staging-buffer reuse", unit: "% wall", better: "low"},
  {key: "diagnostics.chunk_metadata_d2h.wall_pct", label: "Indexed metadata wait, inclusive", unit: "% wall", better: "low"},
  {key: "diagnostics.indexed_aggregate_wait.wall_pct", label: "Wait for aggregate before metadata", unit: "% wall", better: "low"},
  {key: "diagnostics.chunk_metadata_wait.wall_pct", label: "Wait for metadata after aggregate", unit: "% wall", better: "low"},
  {key: "diagnostics.chunk_metadata_copy.wall_pct", label: "Chunk metadata D2H copy time", unit: "% wall", better: "low"},
  {key: "diagnostics.payload_d2h.wall_pct", label: "Wait for payload D2H", unit: "% wall", better: "low"},
  {key: "io_files_waiting_mean", label: "Files with writes waiting", unit: "", better: "high",
   note: "how many writes could run at once; the sink runs one at a time, so this is room available, not room used"},
  {key: "io_files_waiting_peak", label: "Files with writes waiting, peak", unit: "", better: "high"},
  {key: "io_wait_ms_mean", label: "Wait before a write starts", unit: "ms", better: "low"},
  {key: "io_run_ms_mean", label: "Time to run a write", unit: "ms", better: "low"},
];

const SCENARIO_GROUPS = [
  {suffix: "_multiscale_dim0", rank: 2},
  {suffix: "_multiscale", rank: 1},
  {suffix: "_single", rank: 0},
];

// Ordered easiest to hardest to compress.
const FILLS = [
  {key: "zeros", note: "every value is zero"},
  {key: "xor", note: "pixel coordinates xored together"},
  {key: "rand", note: "random values"},
];

// =========================================================================
// Data model
// =========================================================================

const sweeps = DATA.sweeps.slice();
sweeps.forEach(s => { s.dateObj = new Date(s.day + "T00:00:00"); });

/**
 * One entry per machine. Grouped, that is what bench/machines.toml calls the
 * same machine; split, it is each sweep name on its own — the way to check that
 * two systems on one box, or two nodes from one cluster pool, really do match.
 */
function buildMachines(grouped) {
  const seen = new Map();
  for (const sweep of sweeps) {
    const name = grouped ? sweep.machine : sweep.member;
    if (!seen.has(name)) {
      seen.set(name, {
        name,
        description: sweep.description || "",
        specs: sweep.specs || {},
        registered: sweep.registered,
        first: sweep.day, last: sweep.day,
        gpus: [], hosts: [], members: [], sweeps: [],
      });
    }
    const machine = seen.get(name);
    machine.last = sweep.day;
    machine.sweeps.push(sweep);
    if (sweep.registered && !machine.registered) {
      machine.registered = true;
      machine.description = sweep.description || "";
      machine.specs = sweep.specs || {};
    }
    for (const [key, value] of [["gpus", sweep.gpu], ["hosts", sweep.host], ["members", sweep.member]]) {
      if (value && !machine[key].includes(value)) machine[key].push(value);
    }
  }

  // Color follows the machine, assigned in order of first appearance so an
  // added machine never repaints the ones already on screen. Past the palette's
  // eight slots the extra machines stay in the tables but leave the chart.
  const machines = [...seen.values()];
  machines.forEach((machine, i) => {
    machine.color = i < MAX_SERIES ? SERIES_VARS[i] : "var(--series-none)";
    machine.plotted = i < MAX_SERIES;
  });
  return machines;
}

let machineOrder = [];

function metricValue(run, key) {
  const parts = key.split(".");
  let v = run;
  for (const p of parts) {
    if (v == null || typeof v !== "object") return null;
    v = v[p];
  }
  return typeof v === "number" && isFinite(v) ? v : null;
}

function scenarioRank(name) {
  for (const g of SCENARIO_GROUPS) if (name.endsWith(g.suffix)) return g.rank;
  return 0; // only the multiscale variants carry a suffix
}

function sortedScenarios(names) {
  return [...names].sort((a, b) => scenarioRank(a) - scenarioRank(b) || a.localeCompare(b));
}

function fillRank(name) {
  const at = FILLS.findIndex(f => f.key === name);
  return at < 0 ? FILLS.length : at;
}

function fillNote(name) {
  return FILLS.find(f => f.key === name)?.note || "";
}

function sortedFills(names) {
  return [...names].sort((a, b) => fillRank(a) - fillRank(b) || a.localeCompare(b));
}

function distinct(key) {
  const values = new Set();
  for (const s of sweeps) for (const r of s.runs) if (r[key] != null) values.add(r[key]);
  return [...values];
}

const ALL_SCENARIOS = sortedScenarios(distinct("scenario"));
const ALL_CODECS = distinct("codec").sort();
const ALL_FILLS = sortedFills(distinct("fill"));
const ALL_BACKENDS = distinct("backend").sort();
const ALL_SINKS = distinct("sink").sort();

// =========================================================================
// Selection
// =========================================================================

const state = {metric: METRICS[0].key, scenario: null, codec: null, fill: null, backend: null,
               sink: null, grouped: true};

function metricMeta(key) { return METRICS.find(m => m.key === key) || METRICS[0]; }
/** " (GiB/s)" after a label, or nothing at all for a count, which has no unit. */
function unitSuffix(meta) { return meta.unit ? ` (${meta.unit})` : ""; }
/** " GiB/s" after a value, same rule. */
function unitTail(meta) { return meta.unit ? ` ${meta.unit}` : ""; }

/** The opening view should not be empty: pick the config the most sweeps ran. */
function pickDefaults() {
  const counts = new Map();
  for (const s of sweeps) {
    const here = new Set();
    for (const r of s.runs) {
      if (r.status !== "pass" || metricValue(r, state.metric) == null) continue;
      here.add([r.scenario, r.codec, r.backend, r.sink, r.fill].join("|"));
    }
    for (const combo of here) counts.set(combo, (counts.get(combo) || 0) + 1);
  }
  let best = null, bestCount = -1;
  for (const [combo, count] of counts) {
    if (count > bestCount) { best = combo; bestCount = count; }
  }
  const [scenario, codec, backend, sink, fill] = best
    ? best.split("|")
    : [ALL_SCENARIOS[0], ALL_CODECS[0], ALL_BACKENDS[0], ALL_SINKS[0], ALL_FILLS[0]];
  state.scenario = scenario; state.codec = codec; state.backend = backend;
  state.sink = sink; state.fill = fill;
}

/** Everything the filters ask for except the input. */
function matchesSetup(run) {
  return run.codec === state.codec && run.backend === state.backend && run.sink === state.sink;
}

function comparable(sweep) {
  const meta = metricMeta(state.metric);
  const retiredKey = meta.retired || state.metric.split(".").pop();
  return !(sweep.retired || []).includes(retiredKey);
}

/** Best run of a sweep for one scenario and input, under the other filters. */
function bestRun(sweep, scenario, fill) {
  const meta = metricMeta(state.metric);
  const wantHigh = meta.better === "high";
  let best = null, bestValue = null, count = 0;
  for (const run of sweep.runs) {
    if (run.scenario !== scenario || run.fill !== fill) continue;
    if (run.status !== "pass" || !matchesSetup(run)) continue;
    const value = metricValue(run, state.metric);
    if (value == null) continue;
    count++;
    if (bestValue == null || (wantHigh ? value > bestValue : value < bestValue)) {
      best = run; bestValue = value;
    }
  }
  return best ? {run: best, value: bestValue, count} : null;
}

/** Codec, backend, sink, and input combinations with at least one usable run. */
function availableCombinations(scenario) {
  const found = new Set();
  for (const sweep of sweeps) {
    if (!comparable(sweep)) continue;
    for (const run of sweep.runs) {
      if (run.status !== "pass" || metricValue(run, state.metric) == null) continue;
      if (scenario && run.scenario !== scenario) continue;
      found.add([run.codec, run.backend, run.sink, run.fill].join("|"));
    }
  }
  return found;
}

/**
 * Nearest selections that would show something: one changed dimension first,
 * so an empty view says where the data actually is instead of just "none".
 */
function nearestAlternatives(scenario, limit = 3) {
  const available = availableCombinations(scenario);
  const current = [state.codec, state.backend, state.sink, state.fill];
  // Backend and sink first: the codec is usually the deliberate choice, so
  // suggest keeping it and moving where it ran.
  const dimensions = [
    {index: 1, key: "backend", label: "backend"},
    {index: 2, key: "sink", label: "sink"},
    {index: 3, key: "fill", label: "input"},
    {index: 0, key: "codec", label: "codec"},
  ];
  const out = [];
  for (const dimension of dimensions) {
    for (const combo of available) {
      const parts = combo.split("|");
      if (parts.every((p, i) => i === dimension.index || p === current[i]) && parts[dimension.index] !== current[dimension.index]) {
        out.push({label: `${dimension.label} ${parts[dimension.index]}`, key: dimension.key, value: parts[dimension.index]});
      }
    }
  }
  if (!out.length) {
    for (const combo of available) {
      const [codec, backend, sink, fill] = combo.split("|");
      out.push({label: `${codec} · ${backend} · ${sink} · ${fill}`, codec, backend, sink, fill});
      if (out.length >= limit) break;
    }
  }
  return out.slice(0, limit);
}

function emptyState(message, scenario) {
  const node = el("p", "empty");
  node.appendChild(document.createTextNode(message + " "));
  const alternatives = nearestAlternatives(scenario);
  if (!alternatives.length) return node;
  node.appendChild(document.createTextNode("Try: "));
  alternatives.forEach((alternative, i) => {
    if (i) node.appendChild(document.createTextNode(", "));
    const button = el("button", "link-button", alternative.label);
    button.type = "button";
    button.addEventListener("click", () => pick(alternative.key
      ? {[alternative.key]: alternative.value}
      : {codec: alternative.codec, backend: alternative.backend,
         sink: alternative.sink, fill: alternative.fill}));
    node.appendChild(button);
  });
  node.appendChild(document.createTextNode("."));
  return node;
}

/** One point per sweep for a machine: {sweep, value, run, count}. */
function series(machine, scenario, fill) {
  const points = [];
  for (const sweep of machine.sweeps) {
    if (!comparable(sweep)) continue;
    const hit = bestRun(sweep, scenario, fill);
    if (hit) points.push({sweep, ...hit});
  }
  return points;
}

// =========================================================================
// Formatting
// =========================================================================

function fmt(value) {
  if (value == null) return "—";
  const abs = Math.abs(value);
  if (abs >= 1000) return d3.format(",.0f")(value);
  if (abs >= 100) return d3.format(".0f")(value);
  if (abs >= 10) return d3.format(".1f")(value);
  if (abs >= 1) return d3.format(".2f")(value);
  if (abs > 0) return d3.format(".3f")(value);
  return "0";
}

function fmtDay(day) { return day || "unknown date"; }

// Axis labels trim harder than the numbers in the tables.
function fmtTick(value) {
  return Math.abs(value) >= 1000 ? d3.format("~s")(value) : d3.format("~f")(value);
}

function percentChange(previous, latest) {
  if (previous == null || latest == null || previous === 0) return null;
  return (latest - previous) / Math.abs(previous) * 100;
}

/** Direction of a change, judged against what the metric wants. */
function changeClass(pct) {
  if (pct == null || Math.abs(pct) < 2) return "flat";
  const better = metricMeta(state.metric).better === "high" ? pct > 0 : pct < 0;
  return better ? "up" : "down";
}

const CHANGE_GLYPH = {up: "▲", down: "▼", flat: "≈"};
const CHANGE_WORD = {up: "better", down: "worse", flat: "no real change"};
const REAL_CHANGE_PCT = 2;

function signedPercent(pct) {
  const shown = Math.abs(pct) < 100 ? fmt(pct) : d3.format(".0f")(pct);
  return `${pct > 0 ? "+" : ""}${shown}%`;
}

function explorerLink(sweep) {
  return `explore.html?file=${encodeURIComponent(sweep.filename)}`;
}

function setText(node, text) { node.textContent = text; return node; }

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function keySwatch(color, className) {
  const node = el("span", className || "tile-key");
  node.style.background = color;
  return node;
}

function configLabel(run) {
  return [run.dtype, run.chunk_bytes_label].filter(Boolean).join(" · ");
}

// =========================================================================
// Tooltip
// =========================================================================

const tooltip = el("div", "tooltip");
tooltip.style.display = "none";
document.body.appendChild(tooltip);

function showTooltip(event, build) {
  tooltip.replaceChildren();
  build(tooltip);
  tooltip.style.display = "block";
  const box = tooltip.getBoundingClientRect();
  const pad = 14;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + box.width > window.innerWidth - 8) x = event.clientX - box.width - pad;
  if (y + box.height > window.innerHeight - 8) y = event.clientY - box.height - pad;
  tooltip.style.left = Math.max(8, x) + "px";
  tooltip.style.top = Math.max(8, y) + "px";
}

function hideTooltip() { tooltip.style.display = "none"; }

function tooltipRow(parent, color, name, value) {
  const row = el("div", "tt-row");
  if (color) row.appendChild(keySwatch(color, "tt-key"));
  row.appendChild(el("span", "tt-value", value));
  row.appendChild(el("span", "tt-name", name));
  parent.appendChild(row);
  return row;
}

}

// Machine tiles
// =========================================================================

function sparkline(points, color) {
  const W = 176, H = 30, r = 3;
  const svg = d3.create("svg").attr("width", W).attr("height", H)
    .attr("role", "img").attr("aria-hidden", "true");
  if (points.length < 2) return svg.node();
  const x = d3.scaleTime()
    .domain(d3.extent(points, p => p.sweep.dateObj))
    .range([r + 1, W - r - 1]);
  const y = d3.scaleLinear()
    .domain(d3.extent(points, p => p.value)).nice()
    .range([H - r - 1, r + 1]);
  svg.append("path")
    .attr("fill", "none").attr("stroke", color).attr("stroke-width", 2)
    .attr("stroke-linejoin", "round").attr("stroke-linecap", "round")
    .attr("d", d3.line().x(p => x(p.sweep.dateObj)).y(p => y(p.value))(points));
  const last = points[points.length - 1];
  svg.append("circle")
    .attr("cx", x(last.sweep.dateObj)).attr("cy", y(last.value)).attr("r", r)
    .attr("fill", color).attr("stroke", "var(--surface-1)").attr("stroke-width", 2);
  return svg.node();
}

function failureCount(sweep) {
  let fails = 0;
  for (const [status, n] of Object.entries(sweep.counts || {})) {
    if (status !== "pass") fails += n;
  }
  return fails;
}

function renderTiles() {
  const host = document.getElementById("tiles");
  host.replaceChildren();
  const meta = metricMeta(state.metric);

  for (const machine of machineOrder) {
    const points = series(machine, state.scenario, state.fill);
    const latest = points[points.length - 1] || null;
    const previous = points[points.length - 2] || null;
    const latestSweep = machine.sweeps[machine.sweeps.length - 1];

    const tile = el("div", "tile");
    const head = el("div", "tile-head");
    head.appendChild(keySwatch(machine.color));
    head.appendChild(el("span", null, machine.name));
    tile.appendChild(head);

    const specs = Object.entries(machine.specs).map(([key, value]) => `${key}: ${value}`);
    const onlyHost = machine.hosts.length === 1 ? machine.hosts[0] : "";
    const hosts = machine.hosts.length > 1
      ? `${machine.hosts.length} hosts`
      : (onlyHost === machine.name || machine.members.includes(onlyHost) ? "" : onlyHost);
    const sub = el("div", "tile-sub", machine.description || machine.gpus[0] || "");
    if (machine.hosts.length > 1) sub.title = machine.hosts.join(", ");
    tile.appendChild(sub);
    const gpu = machine.description && machine.gpus.length === 1 ? machine.gpus[0] : "";
    tile.appendChild(el("div", "tile-specs", [gpu, ...specs, hosts].filter(Boolean).join(" · ")));
    if (machine.gpus.length > 1) {
      tile.appendChild(el("div", "tile-warn", `${machine.gpus.length} GPU models here: ${machine.gpus.join(", ")}`));
    }

    if (latest) {
      const value = el("div", "tile-value");
      value.appendChild(document.createTextNode(fmt(latest.value)));
      if (meta.unit) value.appendChild(el("span", "unit", meta.unit));
      tile.appendChild(value);
    } else {
      tile.appendChild(el("div", "tile-blank", "No run matches this filter"));
    }

    const delta = el("div", "tile-delta");
    if (latest && previous) {
      const pct = percentChange(previous.value, latest.value);
      const cls = changeClass(pct);
      delta.appendChild(setText(el("span", cls), `${CHANGE_GLYPH[cls]} ${signedPercent(pct)}`));
      delta.appendChild(document.createTextNode(
        cls === "flat" ? ` vs ${previous.sweep.commit} — no real change`
                       : ` ${CHANGE_WORD[cls]} than ${previous.sweep.commit}`));
      if (previous.sweep.member !== latest.sweep.member) {
        delta.appendChild(el("div", "tile-warn",
          `compares ${previous.sweep.member} against ${latest.sweep.member}`));
      }
    } else if (latest) {
      delta.appendChild(document.createTextNode("first sweep with this configuration"));
    }
    tile.appendChild(delta);

    if (points.length >= 2) tile.appendChild(sparkline(points, machine.color));

    const foot = el("div", "tile-foot");
    foot.appendChild(document.createTextNode(
      `${machine.sweeps.length} sweep${machine.sweeps.length === 1 ? "" : "s"} · latest `));
    const link = el("a", null, latestSweep.commit);
    link.href = explorerLink(latestSweep);
    link.title = `Open ${latestSweep.filename} in the benchmark explorer`;
    foot.appendChild(link);
    foot.appendChild(document.createTextNode(
      machine.members.length > 1
        ? ` on ${fmtDay(latestSweep.day)}, ${latestSweep.member}`
        : ` on ${fmtDay(latestSweep.day)}`));
    const fails = failureCount(latestSweep);
    if (fails) {
      foot.appendChild(document.createTextNode(" · "));
      foot.appendChild(el("span", "fails", `${fails} run${fails === 1 ? "" : "s"} did not pass`));
    }
    tile.appendChild(foot);

    if (machine.members.length > 1) {
      tile.appendChild(el("div", "tile-foot", `covers ${machine.members.join(", ")}`));
    }
    if (!machine.registered) {
      tile.appendChild(el("div", "tile-foot tile-warn", "not in machines.toml"));
    }
    host.appendChild(tile);
  }
}

// =========================================================================
// Trend chart
//
// The input decides how much a codec can squeeze out, so one line over all
// inputs jumps whenever a sweep adds or drops an easier one.
// =========================================================================

let trendPanels = [];

function trendLines(fill) {
  return machineOrder
    .filter(m => m.plotted)
    .map(m => ({machine: m, points: series(m, state.scenario, fill)}))
    .filter(l => l.points.length > 0);
}

const panelPoints = panel => panel.lines.flatMap(line => line.points);

function trendNotes() {
  const hidden = machineOrder.filter(m => !m.plotted);
  const meta = metricMeta(state.metric);
  return [
    trendPanels.length && !trendPanels.some(panel => panel.fill === state.fill) &&
      `Nothing ran on ${state.fill} here, so the machine cards are empty. Pick another input.`,
    trendPanels.length > 1 && (sameScaleToggle.checked
      ? "One scale across the panels, so their heights compare directly. Untick it to read a panel whose numbers are much smaller."
      : "Each panel is scaled to its own runs, so their heights do not compare."),
    hidden.length && `${hidden.length} machine(s) beyond the eight-color palette are in the tables only: ${hidden.map(m => m.name).join(", ")}.`,
    meta.note && `Reading this metric: ${meta.note}.`,
  ].filter(Boolean).join(" ");
}

function trendPanelCard(panel) {
  const card = el("div", "panel");
  card.setAttribute("aria-current", panel.fill === state.fill ? "true" : "false");

  const head = el("div", "panel-head");
  const title = el("button", "panel-title", panel.fill);
  title.type = "button";
  title.title = `Show ${panel.fill} on the cards and tables`;
  title.addEventListener("click", () => pick({fill: panel.fill}));
  head.appendChild(title);
  const note = fillNote(panel.fill);
  if (note) head.appendChild(el("span", "panel-sub", note));
  card.appendChild(head);

  const chart = el("div", "chart-wrap");
  card.appendChild(chart);

  const legend = el("div", "legend");
  for (const {machine, points} of panel.lines) {
    const item = el("div", "legend-item");
    item.appendChild(keySwatch(machine.color, "legend-key"));
    item.appendChild(el("span", null, machine.name));
    item.appendChild(el("span", "legend-value", fmt(points[points.length - 1].value)));
    legend.appendChild(item);
  }
  card.appendChild(legend);
  return {card, chart};
}

function renderTrend() {
  const host = document.getElementById("trend-panels");
  host.replaceChildren();
  const meta = metricMeta(state.metric);

  document.getElementById("trend-sub").textContent =
    `Best ${meta.label.toLowerCase()} per sweep — ${state.scenario}, ${state.codec} codec, ${state.backend} backend, ${state.sink} sink. Click a point to open that sweep in the explorer.`;

  trendPanels = ALL_FILLS
    .map(fill => ({fill, lines: trendLines(fill)}))
    .filter(panel => panel.lines.length);

  sameScaleCheck.hidden = trendPanels.length < 2;
  document.getElementById("trend-note").textContent = trendNotes();

  if (!trendPanels.length) {
    host.appendChild(emptyState(
      `No passing runs for ${state.scenario} with ${state.codec} on ${state.backend} into ${state.sink}.`,
      state.scenario));
    return;
  }

  const allPoints = trendPanels.flatMap(panelPoints);
  const dates = d3.sort(d3.union(allPoints.map(p => p.sweep.dateObj)));
  const shared = sameScaleToggle.checked;

  // The first panel measures the whole row until its siblings are there to
  // share it with.
  const charts = trendPanels.map(panel => {
    const {card, chart} = trendPanelCard(panel);
    host.appendChild(card);
    return chart;
  });
  // Reading every width before the first draw costs one layout, not one each.
  const widths = charts.map(chart => chart.clientWidth || 340);
  charts.forEach((chart, i) => drawTrendChart(chart, widths[i], trendPanels[i], meta, dates,
    d3.max(shared ? allPoints : panelPoints(trendPanels[i]), p => p.value)));
}

/** The date axis is shared with the other panels; the value axis may be. */
function drawTrendChart(host, width, panel, meta, dates, maxValue) {
  const height = Math.max(210, Math.min(320, Math.round(width * 0.42)));
  const margin = {top: 22, right: 12, bottom: 26, left: 44};
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const svg = d3.select(host).append("svg")
    .attr("width", width).attr("height", height)
    .attr("role", "img")
    .attr("aria-label", `${meta.label} over time on the ${panel.fill} input, one line per machine`);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleTime().domain(d3.extent(dates)).range([0, innerW]);
  if (dates.length === 1) x.domain([d3.timeDay.offset(dates[0], -1), d3.timeDay.offset(dates[0], 1)]);
  const y = d3.scaleLinear().domain([0, maxValue * 1.08 || 1]).nice().range([innerH, 0]);

  g.append("g").attr("class", "grid")
    .selectAll("line").data(y.ticks(4)).join("line")
    .attr("x1", 0).attr("x2", innerW).attr("y1", d => y(d)).attr("y2", d => y(d));

  const dateTicks = Math.max(2, Math.min(4, Math.floor(innerW / 70), dates.length));
  g.append("g").attr("class", "axis")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).ticks(dateTicks).tickSizeOuter(0).tickFormat(d3.timeFormat("%b %d")));
  g.append("g").attr("class", "axis")
    .call(d3.axisLeft(y).ticks(4).tickSize(0).tickFormat(fmtTick));
  g.append("text").attr("class", "tick-label")
    .attr("x", 0).attr("y", -8).text(meta.unit);

  const line = d3.line().x(p => x(p.sweep.dateObj)).y(p => y(p.value));

  for (const {machine, points} of panel.lines) {
    g.append("path")
      .attr("fill", "none").attr("stroke", machine.color).attr("stroke-width", 2)
      .attr("stroke-linejoin", "round").attr("stroke-linecap", "round")
      .attr("d", line(points));
    g.selectAll(null).data(points).join("circle")
      .attr("cx", p => x(p.sweep.dateObj)).attr("cy", p => y(p.value)).attr("r", 3.5)
      .attr("fill", machine.color)
      .attr("stroke", "var(--surface-1)").attr("stroke-width", 2);
  }

  // Crosshair: aim at a sweep date, read every machine that ran that day.
  const crosshair = g.append("line")
    .attr("stroke", "var(--axis)").attr("stroke-width", 1)
    .attr("y1", 0).attr("y2", innerH).style("display", "none");

  const byDate = new Map();
  for (const {machine, points} of panel.lines) {
    for (const p of points) {
      const key = +p.sweep.dateObj;
      if (!byDate.has(key)) byDate.set(key, []);
      byDate.get(key).push({machine, point: p});
    }
  }
  const drawn = d3.sort(byDate.keys()).map(t => new Date(t));

  const nearestDate = px => d3.least(drawn, d => Math.abs(d - x.invert(px)));
  const nearestPoint = (px, py) =>
    d3.least(byDate.get(+nearestDate(px)) || [], row => Math.abs(y(row.point.value) - py));

  svg.append("rect")
    .attr("x", margin.left).attr("y", margin.top)
    .attr("width", innerW).attr("height", innerH)
    .attr("fill", "transparent")
    .style("cursor", "pointer")
    .on("pointerleave", () => { crosshair.style("display", "none"); hideTooltip(); })
    .on("click", event => {
      const [px, py] = d3.pointer(event, g.node());
      const hit = nearestPoint(px, py);
      if (hit) location.href = explorerLink(hit.point.sweep);
    })
    .on("pointermove", event => {
      const [px] = d3.pointer(event, g.node());
      const nearest = nearestDate(px);
      crosshair.attr("x1", x(nearest)).attr("x2", x(nearest)).style("display", null);
      const rows = byDate.get(+nearest) || [];
      showTooltip(event, node => {
        node.appendChild(el("div", "tt-head", `${d3.timeFormat("%Y-%m-%d")(nearest)} · ${panel.fill}`));
        for (const {machine, point} of rows) {
          const who = machine.members.length > 1
            ? `${machine.name} (${point.sweep.member}) · ${point.sweep.commit}`
            : `${machine.name} · ${point.sweep.commit}`;
          tooltipRow(node, machine.color, who, `${fmt(point.value)}${unitTail(meta)}`);
          node.appendChild(el("div", "tt-head", `  ${configLabel(point.run)} — best of ${point.count} run${point.count === 1 ? "" : "s"}`));
        }
        node.appendChild(el("div", "tt-head", "click to open the nearest sweep in the explorer"));
      });
    });
}

function renderMatrix() {
  const host = document.getElementById("matrix");
  host.replaceChildren();
  const meta = metricMeta(state.metric);
  document.getElementById("matrix-sub").textContent =
    `Best ${meta.label.toLowerCase()}${unitSuffix(meta)} on ${state.fill} in each machine's most recent sweep, with the change from its previous sweep. Every scenario is listed; pick one to plot it above.`;

  const table = el("table", "matrix");
  const thead = el("thead");
  const headRow = el("tr");
  headRow.appendChild(el("th", null, "Scenario"));
  for (const machine of machineOrder) {
    const th = el("th", "machine-th num");
    th.appendChild(keySwatch(machine.color));
    th.appendChild(document.createTextNode(machine.name));
    headRow.appendChild(th);
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el("tbody");
  let anyValue = false;

  for (const scenario of ALL_SCENARIOS) {
    const row = el("tr");
    row.setAttribute("aria-selected", scenario === state.scenario ? "true" : "false");
    row.tabIndex = 0;
    const choose = () => pick({scenario});
    row.addEventListener("click", choose);
    row.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); choose(); } });
    row.appendChild(el("td", "scenario-cell", scenario));

    for (const machine of machineOrder) {
      const points = series(machine, scenario, state.fill);
      const latest = points[points.length - 1] || null;
      const previous = points[points.length - 2] || null;
      const cell = el("td", "num");
      if (!latest) {
        cell.appendChild(el("span", "cell-flat", "—"));
      } else {
        anyValue = true;
        cell.appendChild(document.createTextNode(fmt(latest.value)));
        const pct = percentChange(previous ? previous.value : null, latest.value);
        if (pct != null) {
          const cls = changeClass(pct);
          const tag = el("span", `cell-delta ${cls}`, `${CHANGE_GLYPH[cls]} ${signedPercent(pct)}`);
          tag.title = `${fmt(previous.value)} at ${previous.sweep.commit} (${fmtDay(previous.sweep.day)}) → ${fmt(latest.value)} at ${latest.sweep.commit} (${fmtDay(latest.sweep.day)}) — ${CHANGE_WORD[cls]}`;
          cell.appendChild(tag);
        }
        cell.title = `${latest.sweep.commit} (${fmtDay(latest.sweep.day)}) · ${configLabel(latest.run)} · best of ${latest.count} run${latest.count === 1 ? "" : "s"}`;
      }
      row.appendChild(cell);
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);

  if (!anyValue) {
    host.appendChild(emptyState(`No scenario has a passing run on ${state.fill} with ${state.codec} on ${state.backend} into ${state.sink}.`, null));
    return;
  }
  host.appendChild(table);
}

// =========================================================================
// Movers
// =========================================================================

const MOVERS_SHOWN = 12;

// A run id names the whole configuration, input included, so pairing by id
// compares like with like. Pairing by sweep drops every configuration the
// sweep before skipped.
function moversFor(machine) {
  const history = new Map();
  let newest = null;
  for (const sweep of machine.sweeps) {
    if (!comparable(sweep)) continue;
    for (const run of sweep.runs) {
      if (run.status !== "pass" || !matchesSetup(run)) continue;
      const value = metricValue(run, state.metric);
      if (value == null) continue;
      if (!history.has(run.id)) history.set(run.id, []);
      history.get(run.id).push({sweep, run, value});
      newest = sweep;
    }
  }

  const rows = [];
  for (const seen of history.values()) {
    const now = seen[seen.length - 1];
    if (seen.length < 2 || now.sweep !== newest) continue;
    const then = seen[seen.length - 2];
    const pct = percentChange(then.value, now.value);
    if (pct == null) continue;
    rows.push({machine, run: now.run, previous: then.value, latest: now.value, pct,
               latestSweep: now.sweep, previousSweep: then.sweep});
  }
  return {rows, newest};
}

function renderMovers() {
  const host = document.getElementById("movers");
  host.replaceChildren();
  const meta = metricMeta(state.metric);

  const all = [];
  const newest = [];
  for (const machine of machineOrder) {
    const {rows, newest: sweep} = moversFor(machine);
    if (rows.length) newest.push(`${machine.name} ${sweep.commit}`);
    all.push(...rows);
  }
  document.getElementById("movers-sub").textContent = newest.length
    ? `${meta.label} in each machine's most recent sweep (${newest.join(", ")}) against the last sweep that ran the same configuration. Hover a value to see which sweep it came from.`
    : `${meta.label} in each machine's most recent sweep against the last sweep that ran the same configuration.`;

  if (!all.length) {
    host.appendChild(el("p", "empty", "Nothing to compare under this filter. A change needs the same configuration in two of a machine's sweeps."));
    return;
  }

  // Take turns between machines so the busiest machine cannot fill the table,
  // and put real movement ahead of the many configurations that barely moved.
  const shown = [];
  const queues = machineOrder
    .map(machine => all.filter(r => r.machine === machine).sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct)))
    .filter(q => q.length);
  const realCount = all.filter(r => Math.abs(r.pct) >= REAL_CHANGE_PCT).length;
  for (const onlyReal of [true, false]) {
    let took = true;
    while (took && shown.length < MOVERS_SHOWN) {
      took = false;
      for (const queue of queues) {
        if (shown.length >= MOVERS_SHOWN) break;
        const next = queue.findIndex(r => !shown.includes(r) && (!onlyReal || Math.abs(r.pct) >= REAL_CHANGE_PCT));
        if (next >= 0) { shown.push(queue[next]); took = true; }
      }
    }
  }

  const table = el("table");
  const thead = el("thead");
  const headRow = el("tr");
  for (const [label, cls] of [["Machine", ""], ["Scenario", ""], ["Input", ""], ["Configuration", ""],
                              ["Previous", "num"], ["Latest", "num"], ["Change", "num"]]) {
    headRow.appendChild(el("th", cls, label));
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el("tbody");
  for (const row of shown) {
    const tr = el("tr");
    const machineCell = el("td");
    machineCell.appendChild(keySwatch(row.machine.color));
    machineCell.appendChild(document.createTextNode(" " + row.machine.name));
    tr.appendChild(machineCell);
    tr.appendChild(el("td", null, row.run.scenario));
    tr.appendChild(el("td", null, row.run.fill));
    tr.appendChild(el("td", null, configLabel(row.run)));
    for (const [value, sweep] of [[row.previous, row.previousSweep], [row.latest, row.latestSweep]]) {
      const cell = el("td", "num", fmt(value));
      cell.title = row.machine.members.length > 1
        ? `${sweep.commit} on ${fmtDay(sweep.day)}, ${sweep.member}`
        : `${sweep.commit} on ${fmtDay(sweep.day)}`;
      tr.appendChild(cell);
    }
    const cls = changeClass(row.pct);
    const change = el("td", "num");
    change.appendChild(el("span", `cell-delta ${cls}`,
      `${CHANGE_GLYPH[cls]} ${signedPercent(row.pct)} ${CHANGE_WORD[cls]}`));
    tr.appendChild(change);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  host.appendChild(table);

  if (all.length > shown.length) {
    host.appendChild(el("p", "note",
      `Showing ${shown.length} of ${all.length} shared configurations, taking turns between machines; ` +
      `${realCount} moved by ${REAL_CHANGE_PCT}% or more. The rest are in the benchmark explorer.`));
  }

  const crossing = [...new Set(shown
    .filter(row => row.previousSweep.member !== row.latestSweep.member)
    .map(row => `${row.previousSweep.member} → ${row.latestSweep.member}`))];
  if (crossing.length) {
    host.appendChild(el("p", "note",
      `Some rows compare across the systems grouped into one machine (${crossing.join(", ")}). ` +
      "Untick Group to keep them apart."));
  }
}

// =========================================================================
// Table view (the twin of the trend chart)
// =========================================================================

function renderTrendTable() {
  const host = document.getElementById("trend-table");
  host.replaceChildren();
  const meta = metricMeta(state.metric);

  if (!trendPanels.length) {
    host.appendChild(el("p", "empty", "Nothing plotted."));
    return;
  }

  const rows = [];
  for (const {fill, lines} of trendPanels) {
    for (const {machine, points} of lines) {
      for (const p of points) rows.push({fill, machine, p});
    }
  }
  rows.sort((a, b) => fillRank(a.fill) - fillRank(b.fill)
                   || a.p.sweep.dateObj - b.p.sweep.dateObj
                   || a.machine.name.localeCompare(b.machine.name));

  const table = el("table");
  const thead = el("thead");
  const headRow = el("tr");
  for (const [label, cls] of [["Input", ""], ["Date", ""], ["Machine", ""], ["Commit", ""],
                              [`${meta.label}${unitSuffix(meta)}`, "num"], ["Best configuration", ""], ["Runs", "num"]]) {
    headRow.appendChild(el("th", cls, label));
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el("tbody");
  for (const {fill, machine, p} of rows) {
    const tr = el("tr");
    tr.appendChild(el("td", null, fill));
    tr.appendChild(el("td", null, fmtDay(p.sweep.day)));
    const machineCell = el("td");
    machineCell.appendChild(keySwatch(machine.color));
    machineCell.appendChild(document.createTextNode(" " + machine.name));
    tr.appendChild(machineCell);
    tr.appendChild(el("td", null, p.sweep.commit));
    tr.appendChild(el("td", "num", fmt(p.value)));
    tr.appendChild(el("td", null, configLabel(p.run)));
    tr.appendChild(el("td", "num", String(p.count)));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  host.appendChild(el("p", "card-sub", `${state.scenario}, ${state.codec} codec, ${state.backend} backend, ${state.sink} sink.`));
  host.appendChild(table);
}

// =========================================================================
// Page
// =========================================================================

function renderLede() {
  const days = sweeps.map(s => s.day).filter(Boolean).sort();
  const span = days.length ? `${days[0]} to ${days[days.length - 1]}` : "no dates";
  document.getElementById("lede").textContent =
    `${sweeps.length} sweeps · ${machineOrder.length} machines · ${span}`;

  const versions = [...new Set(sweeps.map(s => s.migrated_from ?? s.version))].sort();
  const strangers = [...new Set(sweeps.filter(s => !s.registered).map(s => s.member))];
  const notes = [
    "Machines are grouped by bench/machines.toml, which is where a box running two systems, or a pool of cluster nodes, is declared to be one machine. Untick Group to see the sweep names underneath.",
    "Each plotted value is the best run of a sweep for the chosen scenario, input, and configuration; the remaining dimensions (data type, chunk size) are searched, not averaged.",
    "Only passing runs count. A missing point means that sweep ran nothing matching the filter.",
  ];
  if (strangers.length) {
    notes.push(`Not described in bench/machines.toml: ${strangers.join(", ")}. Add an entry there to name and group them.`);
  }
  if (versions.length > 1) {
    notes.push(`Sweeps here were written at result-schema versions ${versions.join(", ")}; a metric whose meaning changed between them is dropped from comparisons rather than converted.`);
  }
  document.getElementById("footnotes").textContent = notes.join(" ");
}

function renderMatchCount() {
  let runs = 0, sweepsHit = 0;
  for (const sweep of sweeps) {
    let here = 0;
    for (const run of sweep.runs) {
      if (run.status === "pass" && matchesSetup(run) && run.fill === state.fill
          && metricValue(run, state.metric) != null) here++;
    }
    runs += here;
    if (here) sweepsHit++;
  }
  document.getElementById("match-count").textContent =
    `${runs} passing runs in ${sweepsHit} of ${sweeps.length} sweeps match`;
}

function render() {
  machineOrder = buildMachines(state.grouped);
  renderLede();
  renderMatchCount();
  renderTiles();
  renderTrend();
  renderMatrix();
  renderMovers();
  renderTrendTable();
}

pickDefaults();
syncControls();
render();

let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderTrend(); }, 120);
});
</script>
